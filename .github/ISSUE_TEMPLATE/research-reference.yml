name: Research or reference proposal
description: Add a paper, implementation, dataset, correction, or research question.
title: "[Research]: "
labels:
  - research
body:
  - type: dropdown
    id: kind
    attributes:
      label: Contribution type
      options:
        - Primary paper
        - Repository or implementation
        - Dataset or benchmark
        - Correction to existing material
        - Research question
    validations:
      required: true
  - type: input
    id: canonical_url
    attributes:
      label: Canonical URL or DOI
    validations:
      required: true
  - type: textarea
    id: relevance
    attributes:
      label: Relevance
      description: Which mechanism, comparison, or claim does this inform?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and caveats
      description: Distinguish primary evidence from discovery leads or summaries.
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: Code or dataset license
      description: Required for reusable software or data. Use "not applicable" for a paper.
    validations:
      required: true
