name: Repository Integrity

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-contract:
    name: Linux repository tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the proposed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show the runtime
        run: python3 --version

      - name: Validate the research-lab contract
        run: python3 scripts/validate_repository.py

      - name: Run repository tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  repository-integrity:
    name: Repository integrity
    needs: linux-contract
    if: ${{ always() }}
    # Exact full-panel replay has a documented platform boundary; see
    # docs/portability.md. Keep Linux contract coverage as a prerequisite.
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Require Linux contract checks
        if: ${{ needs.linux-contract.result != 'success' }}
        run: exit 1

      - name: Check out the proposed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select the reference Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
          architecture: arm64

      - name: Show the runtime
        run: python3 -c 'import platform; print(platform.python_version()); print(platform.platform())'

      - name: Validate the research-lab contract
        run: python3 scripts/validate_repository.py

      - name: Run repository tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Reproduce registered experiments without changing retained evidence
        run: python3 scripts/reproduce_experiments.py
